version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: floraai_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - flora_mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floraai_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=floraai_db
      - CORS_ORIGINS=*
      - FRONTEND_URL=http://localhost:3000
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: floraai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  flora_mongo_data:
